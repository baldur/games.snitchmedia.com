<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snitchmedia Games</title>
  <link rel="stylesheet" href="shared/site.css">
  <style>
    main { max-width: 40rem; margin: 0 auto; padding: 3rem 0; }
    h1 { font-size: clamp(2rem, 8vw, 3.5rem); line-height: 1; margin: 0 0 0.5rem; }
    .lede { color: var(--dim); margin: 0 0 2.5rem; }
    ul { list-style: none; padding: 0; margin: 0; }
    .games li { border-top: 1px solid var(--line); }
    .games a { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; padding: 1rem 0; text-decoration: none; }
    .games strong { font-size: 1.5rem; }
    .games span { color: var(--dim); font-size: 0.9rem; text-align: right; }
    .games a:hover strong { color: var(--accent); }
    footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--line); color: var(--dim); }
  </style>
</head>
<body>
  <main>
    <h1>Snitchmedia Games</h1>
    <p class="lede">Games made with nothing but the web platform. No libraries, no build step.</p>

    <ul class="games">
      <li><a href="pong/"><strong>Pong</strong><span>Canvas, Gamepad API, Web Audio, touch</span></a></li>
    </ul>

    <footer>
      <a href="classic/">The original 2010 &ldquo;Dom Games&rdquo;</a>: Snake, Pong, Bricks, Connect Four and Tic Tac Toe, built with jQuery and divs.
    </footer>
  </main>
</body>
</html>
